<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live pipeline — Solanus Casey Archive</title>
<link rel="stylesheet" href="/static/theme.css" />
<link rel="stylesheet" href="/static/vendor/drawflow.min.css" />
<script src="/static/vendor/drawflow.min.js"></script>
<style>
  /* Standalone pop-out of the live pipeline. Movable to another monitor; stays live over a
     BroadcastChannel from the main tab. Node CSS mirrors index.html's pipeline rules. */
  html, body { margin: 0; height: 100%; background: var(--provincial-light); font-family: var(--font-body); }
  .pp-head { display: flex; align-items: center; justify-content: space-between; gap: .6em;
    padding: .6em 1em; background: var(--provincial); color: #fff; }
  .pp-title { font-family: var(--font-head); font-weight: 700; font-size: 1.05rem; }
  .pp-tools { display: flex; gap: .4em; align-items: center; }
  .pp-tools button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 6px;
    width: 2em; height: 2em; font-size: 1.2rem; line-height: 1; cursor: pointer; font-family: var(--font-head); }
  .pp-tools button:hover { background: rgba(255,255,255,.32); }
  .pp-hint { padding: .4em 1em; font-size: .85rem; color: var(--provincial-dark); background: #efe7dd; }
  #pipeline-flow { width: 100%; height: calc(100vh - 92px); background: var(--provincial-light); cursor: grab; }
  #pipeline-flow:active { cursor: grabbing; }
  /* #pipeline-flow prefix beats Drawflow's own ".drawflow .drawflow-node" default (the cyan node bg) */
  #pipeline-flow .drawflow-node { background: var(--white); border: 1px solid var(--provincial-mid);
    border-radius: var(--radius); box-shadow: var(--shadow); padding: 0; width: 210px;
    transition: background .2s, border-color .2s; }
  #pipeline-flow .pnode { padding: .65em .8em; }
  #pipeline-flow .pnode b { font-family: var(--font-head); font-size: 1rem; color: var(--provincial); line-height: 1.2; }
  #pipeline-flow .pnode .pnode-sub { display: block; font-size: .82rem; color: var(--provincial-dark); margin-top: .15em; }
  #pipeline-flow .drawflow-node .input, #pipeline-flow .drawflow-node .output { background: var(--provincial); border: 2px solid #fff; height: 12px; width: 12px; }
  #pipeline-flow .drawflow .connection .main-path { stroke: var(--provincial-mid); stroke-width: 2.5px; }
  #pipeline-flow .drawflow-node.st-inactive { opacity: .4; filter: grayscale(.55); }
  #pipeline-flow .drawflow-node.st-active { background: #2f6b41; border-color: #21502f; box-shadow: 0 0 0 2px rgba(47,107,65,.3); }
  #pipeline-flow .drawflow-node.st-active .pnode b, #pipeline-flow .drawflow-node.st-active .pnode .pnode-sub { color: #eafaef; }
  #pipeline-flow .drawflow-node.st-running { background: #e58a17; border-color: #b96f0e; position: relative; z-index: 6;
    animation: pnpulse 1.1s ease-out infinite; }
  #pipeline-flow .drawflow-node.st-running .pnode b, #pipeline-flow .drawflow-node.st-running .pnode .pnode-sub { color: #fff; }
  @keyframes pnpulse { 0% { box-shadow: 0 0 0 0 rgba(229,138,23,.65); }
    70% { box-shadow: 0 0 0 16px rgba(229,138,23,0); } 100% { box-shadow: 0 0 0 0 rgba(229,138,23,0); } }
</style>
</head>
<body>
  <div class="pp-head">
    <span class="pp-title">Live pipeline — how your last question flowed</span>
    <span class="pp-tools">
      <button id="zo" title="smaller nodes">−</button>
      <button id="zi" title="bigger nodes">+</button>
      <button id="zf" title="fit" style="font-size:.9rem;width:auto;padding:0 .6em;">fit</button>
    </span>
  </div>
  <div class="pp-hint">Drag the background to pan · scroll or −/+ to zoom · green = fired, amber pulse = running now.
    This window updates live and can live on a second monitor.</div>
  <div id="pipeline-flow"></div>
<script>
(function () {
  const FLOW_SUB = { io: "in / out", control: "routing", retrieval: "retrieval", rerank: "re-rank",
                     llm: "generation", model: "model", output: "output" };
  const host = document.getElementById("pipeline-flow");
  let ed = null, stageId = {};

  async function build() {
    if (typeof Drawflow === "undefined") { host.innerHTML = "<p style='padding:1em'>flow library failed to load.</p>"; return; }
    let g;
    try { g = await (await fetch("/api/agent_graph")).json(); }
    catch { host.innerHTML = "<p style='padding:1em'>pipeline graph unavailable.</p>"; return; }
    ed = new Drawflow(host); ed.reroute = false; ed.start(); ed.editor_mode = "fixed";  // pan + zoom, no node-drag
    const SX = 1.12, SY = 1.32;
    for (const n of g.nodes) {
      const html = '<div class="pnode"><b>' + n.label + '</b><span class="pnode-sub">' + (FLOW_SUB[n.kind] || n.kind) + '</span></div>';
      const nid = ed.addNode(n.id, 1, 1, Math.round(n.x * SX), Math.round(n.y * SY), "st-inactive", {}, html, false);
      stageId[n.id] = nid;
    }
    for (const e of g.edges) {
      const a = stageId[e.from], b = stageId[e.to];
      if (a != null && b != null) { try { ed.addConnection(a, b, "output_1", "input_1"); } catch (_) {} }
    }
    apply(_pending);                     // paint any state that arrived before build finished
  }
  function setState(stage, state) {
    const id = stageId[stage]; if (id == null) return;
    const dom = document.getElementById("node-" + id); if (!dom) return;
    dom.classList.remove("st-active", "st-running", "st-inactive", "st-error");
    dom.classList.add("st-" + state);
  }
  let _pending = { active: [], running: [] };
  function apply(s) {
    _pending = s || _pending;
    if (!ed) return;
    Object.keys(stageId).forEach((k) => setState(k, "inactive"));
    (_pending.active || []).forEach((k) => setState(k, "active"));
    (_pending.running || []).forEach((k) => setState(k, "running"));
  }

  // live link to the main tab
  if ("BroadcastChannel" in window) {
    const ch = new BroadcastChannel("solanus-pipeline");
    ch.onmessage = (e) => { if (e.data && e.data.type === "state") apply({ active: e.data.active, running: e.data.running }); };
    ch.postMessage({ type: "hello" });   // ask the main tab to replay the current state
  }

  document.getElementById("zi").onclick = () => ed && ed.zoom_in();
  document.getElementById("zo").onclick = () => ed && ed.zoom_out();
  document.getElementById("zf").onclick = () => { if (ed) { ed.zoom = 1; ed.zoom_refresh(); ed.canvas_x = 0; ed.canvas_y = 0; ed.zoom_refresh(); } };
  build();
})();
</script>
</body>
</html>
