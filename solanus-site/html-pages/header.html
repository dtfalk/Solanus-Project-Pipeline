<!--
  header.html — the site header MARKUP (an HTML fragment, injected into every
  page's #header-placeholder by load-fragments.js).

  IMPORTANT: the visible nav links, social icons and logo below are only a
  FALLBACK. On every page global.js rebuilds them from data/global.json, so to
  change the menu/social/logo you edit global.json (or use the editor's
  "Header & footer" page) — not this file. What this file really provides is the
  STRUCTURE the engine hooks into: the class/id names global.js and header.js
  look for (.site-header, .menu-toggle, #mobileMenu, .main-nav .menu,
  .mobile-menu-links, .social-icons, .logo img) plus the social-icon <symbol>
  defs at the bottom (add a <symbol> here to offer a new social platform).
-->
<header class="site-header">
  <!-- Hamburger button: opens the mobile menu overlay (header.js wires it). -->
  <button class="menu-toggle" aria-label="Open menu">&#9776;</button>

  <!-- Full-screen mobile menu overlay (hidden on desktop via CSS). -->
  <div class="mobile-menu-overlay" id="mobileMenu">
    <button type="button" class="close-menu" aria-label="Close menu">&times;</button>

    <!-- Mobile nav links — a mirror of the desktop menu (global.js fills both). -->
    <ul class="mobile-menu-links">
      <li><a href="/" data-track="navhome">Home</a></li>
      <li><a href="/showcase" data-track="navshowcase">Showcase</a></li>
    </ul>

    <div class="mobile-social-icons">
      <div class="social-icons" aria-label="Social media links"></div>
    </div>
  </div>

  <!-- Desktop navigation (global.js makes this list editable in the editor). -->
  <nav class="main-nav" aria-label="Primary navigation">
    <ul class="menu">
      <li><a href="/" data-track="navhome">Home</a></li>
      <li><a href="/showcase" data-track="navshowcase">Showcase</a></li>
    </ul>
  </nav>

  <!-- Logo (global.js sets the src from global.json.logo). -->
  <div class="logo-wrapper">
    <div class="logo-center-inner">
      <a href="/" class="logo" aria-label="Home" data-track="navlogo">
        <img src="/media-content/logo.svg" alt="" />
      </a>
    </div>
  </div>

  <!-- Desktop social icons (global.js fills this from global.json.social). -->
  <div class="social-icons" aria-label="Social media links"></div>

  <!--
    Backend health indicator (dot + status text). Hidden until the health poller
    (blocks.js EXTENDED CATALOGUE) finds it and starts polling the health
    endpoint. Mirrors the OLD reading-room app's #health-dot / #health-text.
  -->
  <span class="header-health" hidden><i class="dot"></i><span class="ht">checking…</span></span>

  <!--
    Header-level Settings button. Hidden by default; an interactive block on the
    page (e.g. the conversation block) un-hides it and wires it to toggle its own
    settings drawer. Kept generic — no page reaches into it except via the
    convention class name below. Mirrors the OLD reading-room app's top-right
    .settings-btn (which opened the model/retrieval settings).
  -->
  <button type="button" class="header-settings-btn" aria-label="Settings" hidden>settings</button>
</header>

  Social-icon SVG symbols. Each <symbol id="..."> is referenced by a
  site-config.js socialIcons[].id. These are generic brand glyphs; keep the ones
  you use and add new ones here as needed.
-->
