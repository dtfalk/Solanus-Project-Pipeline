name: Deploy Pagesmith site (Free / managed functions)

# $0 path: SWA **Free** + the built-in managed functions (the api/ folder ships AS the SWA's
# /api — no separate Function App, no managed identity; storage via the SAS app settings from
# infra/provision-free.sh).
#
# This is the push-triggered default. The old Standard-tier deploy.yml (linked Function
# App via OIDC) was removed — no Pagesmith Function App exists and all SWAs run on the Free SKU.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Static Web App + managed functions
    steps:
      - uses: actions/checkout@v4

      # Inject the real storage account name into the media/content <meta> tags.
      # Repo → Settings → Variables → STORAGE_ACCOUNT = <your storage account>.
      - name: Inject storage account into metas
        run: |
          test -n "${{ vars.STORAGE_ACCOUNT }}" || { echo "Set repo variable STORAGE_ACCOUNT"; exit 1; }
          grep -rl "__STORAGE_ACCOUNT__" app | xargs -r sed -i "s/__STORAGE_ACCOUNT__/${{ vars.STORAGE_ACCOUNT }}/g"

      # DEV/editor SWA (pagesmith-preview → delightful-cliff-*): the private draft site
      # the editor runs on. It uses the GATED config (staticwebapp.dev.config.json)
      # so unauthenticated visitors are redirected to login — only signed-in users
      # see the draft. Swap the gated config in just for this deploy.
      - name: Use gated (login-required) config for dev
        run: cp app/staticwebapp.dev.config.json app/staticwebapp.config.json
      - name: Deploy to dev SWA (pagesmith-preview)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_PREVIEW_TOKEN }}
          action: upload
          app_location: app
          api_location: api          # built-in managed functions (Free path)
          output_location: ""
          skip_app_build: true

      # PROD SWA (pagesmith-prod → gray-wave-*): the PUBLIC site. Restore the committed
      # public config (no login wall) before deploying here.
      - name: Restore public config for prod
        run: git checkout -- app/staticwebapp.config.json
      - name: Deploy to prod SWA (pagesmith-prod)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app
          api_location: api          # built-in managed functions (Free path)
          output_location: ""
          skip_app_build: true
