<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />

    <!-- Route /media-content/* and /data/*.json to blob storage in the cloud.
         The deploy substitutes __STORAGE_ACCOUNT__; on localhost media-base.js
         ignores these and reads the local Azurite emulator instead. -->
    <meta name="media-base" content="https://__STORAGE_ACCOUNT__.blob.core.windows.net/media-dev" />
    <meta name="media-base-prod" content="https://__STORAGE_ACCOUNT__.blob.core.windows.net/media-prod" />
    <meta name="content-base" content="https://__STORAGE_ACCOUNT__.blob.core.windows.net/content-dev" />
    <meta name="content-base-prod" content="https://__STORAGE_ACCOUNT__.blob.core.windows.net/content-prod" />
    <script src="/javascript/site-config.js"></script>
    <script src="/javascript/media-base.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- This is the home page. `engine-page=home` tells page.js to load
         page-home.json; its sections[] are rendered by the catalogue. -->
    <meta name="engine-page" content="home" />

    <!-- page.js overwrites this title from the page data + siteName once the
         content loads; the placeholder just avoids a flash of the URL. -->
    <title>&#8230;</title>
    <link rel="icon" href="/media-content/logo.svg" type="image/svg+xml" />
    <meta name="description" content="A starter site built with Pagesmith." />

    <!-- Shared chrome + global reset/layout. The page body is built entirely
         from page-home.json's sections[], so there is no per-page CSS/JS. -->
    <link rel="stylesheet" href="/css/header.css" />
    <link rel="stylesheet" href="/css/footer.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <style>
      /* Optional full-bleed page background (theme.bgImage, set via theme.js),
         with --site-bg as the base colour. */
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        color: var(--site-ink, #f0f0f0);
        background-color: var(--site-bg, #141414);
        background-image: var(--site-bg-image, none);
        background-size: cover; background-position: center; background-repeat: no-repeat;
      }
      @media (max-width: 760px) { body { background-image: var(--site-bg-image-mobile, var(--site-bg-image, none)); } }
      /* With a photo background, --site-panel gives content a dark readable
         panel; transparent (no panel) otherwise. */
      body > main { max-width: 1000px; width: 100%; margin: 0 auto; padding: 7rem 1rem 3rem; box-sizing: border-box; background: var(--site-panel, transparent); border-radius: 16px; }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <!-- The catalogue renders this page's sections[] into #engine-sections here. -->
    <main></main>

    <div id="footer-placeholder"></div>

    <script src="/javascript/load-fragments.js"></script>
    <script src="/javascript/header.js"></script>
    <script src="/javascript/footer.js"></script>
    <script src="/javascript/page.js"></script>
  </body>
</html>
